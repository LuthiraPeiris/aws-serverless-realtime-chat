<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverless Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b1020;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-strong: rgba(15, 23, 42, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bubble-other: rgba(255, 255, 255, 0.06);
      --bubble-mine: linear-gradient(135deg, #6366f1, #8b5cf6);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(139, 92, 246, 0.18), transparent 26%),
        linear-gradient(135deg, #060816, #0b1020 45%, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .app-shell {
      width: min(1100px, 100%);
      height: min(92vh, 900px);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    .sidebar,
    .chat-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .sidebar {
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: white;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-text p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-card,
    .profile-card,
    .info-card {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      padding: 18px;
    }

    .status-card {
      margin-bottom: 16px;
    }

    .card-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: 0 0 18px currentColor;
    }

    .status.connected {
      background: var(--success);
      color: var(--success);
    }

    .status.connecting {
      background: var(--warning);
      color: var(--warning);
    }

    .status.disconnected {
      background: var(--danger);
      color: var(--danger);
    }

    .status-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .profile-card label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .profile-card input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 14px;
      outline: none;
      transition: 0.2s ease;
    }

    .profile-card input:focus {
      border-color: rgba(99, 102, 241, 0.7);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
    }

    .info-card {
      margin-top: 16px;
    }

    .info-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .chat-panel {
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .chat-header-left h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .chat-header-left p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .live-chip {
      border: 1px solid rgba(99, 102, 241, 0.25);
      background: rgba(99, 102, 241, 0.12);
      color: #c7d2fe;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
    }

    #messages::-webkit-scrollbar {
      width: 10px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
    }

    .msg {
      max-width: min(72%, 620px);
      padding: 14px 16px 12px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeInUp 0.22s ease;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bubble-other);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .msg.mine {
      align-self: flex-end;
      background: var(--bubble-mine);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.28);
    }

    .msg .who {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      opacity: 0.85;
      text-transform: uppercase;
    }

    .msg .time {
      font-size: 11px;
      opacity: 0.65;
      margin-top: 8px;
      text-align: right;
    }

    .sys {
      align-self: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 12px;
      animation: fadeInUp 0.22s ease;
    }

    .input-wrap {
      padding: 18px 20px 20px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 10px;
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: #7c8aa5;
    }

    .input-bar button {
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-radius: 14px;
      padding: 13px 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.28);
    }

    .input-bar button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(99, 102, 241, 0.34);
    }

    .input-bar button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 920px) {
      .app-shell {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        padding: 18px;
      }

      .chat-panel {
        min-height: 78vh;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .chat-header {
        padding: 18px;
        flex-direction: column;
        align-items: flex-start;
      }

      #messages {
        padding: 18px;
      }

      .input-wrap {
        padding: 14px;
      }

      .msg {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-badge">S</div>
          <div class="brand-text">
            <h1>Serverless Chat</h1>
            <p>Real-time WebSocket messaging</p>
          </div>
        </div>

        <div class="status-card">
          <div class="card-label">Connection</div>
          <div class="status-row">
            <div class="status connecting" id="statusDot"></div>
            <span class="status-label" id="statusLabel">Connecting...</span>
          </div>
        </div>

        <div class="profile-card">
          <label for="username">Username</label>
          <input id="username" type="text" value="User" maxlength="20" />
        </div>
      </div>
    </aside>

    <main class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-left">
          <h2>Team Conversation</h2>
          <p>Secure serverless messaging powered by AWS WebSockets</p>
        </div>
        <div class="live-chip">Live Session</div>
      </div>

      <div id="messages"></div>

      <div class="input-wrap">
        <div class="input-bar">
          <input id="msgInput" type="text" placeholder="Write a message..." maxlength="500" />
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const WS_URL = "wss://2sfd2w151d.execute-api.us-east-1.amazonaws.com/prod";

    let ws = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let manuallyClosed = false;

    const messagesEl = document.getElementById("messages");
    const usernameEl = document.getElementById("username");
    const msgInputEl = document.getElementById("msgInput");
    const sendBtnEl = document.getElementById("sendBtn");
    const statusDotEl = document.getElementById("statusDot");
    const statusLabelEl = document.getElementById("statusLabel");

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }

      clearTimeout(reconnectTimer);
      setStatus("connecting");
      setSendEnabled(false);

      try {
        ws = new WebSocket(WS_URL);
      } catch (err) {
        console.error("WebSocket constructor error:", err);
        addSys("Failed to create WebSocket connection.");
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus("connected");
        setSendEnabled(true);
        addSys("Connected to chat room");
        console.log("WebSocket connected");
      };

      ws.onmessage = (event) => {
        console.log("Incoming message:", event.data);

        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          addSys(String(event.data));
          return;
        }

        const currentUser = usernameEl.value.trim() || "Anonymous";
        const sender = data.username || data.user || "Unknown";
        const message = data.message || data.body || JSON.stringify(data);
        const timestamp = data.timestamp || data.time || new Date().toISOString();

        addMsg(sender, message, timestamp, sender === currentUser);
      };

      ws.onerror = (event) => {
        console.error("WebSocket error:", event);
      };

      ws.onclose = (event) => {
        setStatus("disconnected");
        setSendEnabled(false);

        console.log("WebSocket closed:", {
          code: event.code,
          reason: event.reason,
          wasClean: event.wasClean
        });

        addSys(`Disconnected (code: ${event.code || "unknown"})`);

        if (!manuallyClosed) {
          scheduleReconnect();
        }
      };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectAttempts += 1;

      const delay = Math.min(3000 * reconnectAttempts, 10000);
      addSys(`Reconnecting in ${Math.round(delay / 1000)}s...`);

      reconnectTimer = setTimeout(() => {
        connect();
      }, delay);
    }

    function send() {
      const msg = msgInputEl.value.trim();
      const user = usernameEl.value.trim() || "Anonymous";

      if (!msg) return;

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addSys("Cannot send message: WebSocket is not connected.");
        return;
      }

      const payload = {
        action: "sendMessage",
        message: msg,
        username: user,
        timestamp: new Date().toISOString()
      };

      try {
        ws.send(JSON.stringify(payload));
        msgInputEl.value = "";
      } catch (err) {
        console.error("Send failed:", err);
        addSys("Failed to send message.");
      }
    }

    function addMsg(user, msg, ts, mine) {
      const el = document.createElement("div");
      el.className = "msg " + (mine ? "mine" : "other");

      const timeText = ts
        ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        : "";

      el.innerHTML = `
        <div class="who">${esc(user)}</div>
        <div>${esc(msg)}</div>
        <div class="time">${esc(timeText)}</div>
      `;

      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSys(text) {
      const el = document.createElement("div");
      el.className = "sys";
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(state) {
      statusDotEl.className = "status " + state;
      statusLabelEl.textContent =
        state === "connected"
          ? "Connected"
          : state === "connecting"
          ? "Connecting..."
          : "Disconnected";
    }

    function setSendEnabled(enabled) {
      sendBtnEl.disabled = !enabled;
      msgInputEl.disabled = !enabled;
      msgInputEl.placeholder = enabled
        ? "Write a message..."
        : "Waiting for connection...";
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    sendBtnEl.addEventListener("click", send);

    msgInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    window.addEventListener("beforeunload", () => {
      manuallyClosed = true;
      clearTimeout(reconnectTimer);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
    });

    connect();
  </script>
</body>
</html>
